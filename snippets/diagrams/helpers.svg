" y="29.0">Load Balancer Controller</text><text class="sub" x="44" y="46.0">watches Services</text></g><g class="node" transform="translate(30 125)"><rect class="body" width="300" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#326CE5"/><text class="gly" x="23" y="35.5" text-anchor="middle">K8S</text><text class="ttl" x="44" y="29.0">ExternalDNS</text><text class="sub" x="44" y="46.0">watches Ingresses</text></g><g class="node" transform="translate(30 205)"><rect class="body" width="300" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#326CE5"/><text class="gly" x="23" y="35.5" text-anchor="middle">K8S</text><text class="ttl" x="44" y="29.0">cert-manager</text><text class="sub" x="44" y="46.0">watches certificates</text></g><g class="node" transform="translate(30 285)"><rect class="body" width="300" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#326CE5"/><text class="gly" x="23" y="35.5" text-anchor="middle">K8S</text><text class="ttl" x="44" y="29.0">Cluster Autoscaler</text><text class="sub" x="44" y="46.0">watches pods that can&#x27;t start</text></g><g class="node" transform="translate(640 45)"><rect class="body" width="330" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#8C4FFF"/><text class="gly" x="23" y="35.5" text-anchor="middle">LB</text><text class="ttl" x="44" y="29.0">Load balancers (NLB)</text><text class="sub" x="44" y="46.0">one per pwn challenge, one for web</text></g><g class="node" transform="translate(640 125)"><rect class="body" width="330" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#8C4FFF"/><text class="gly" x="23" y="35.5" text-anchor="middle">DNS</text><text class="ttl" x="44" y="29.0">DNS records</text><text class="sub" x="44" y="46.0">in Route 53</text></g><g class="node" transform="translate(640 205)"><rect class="body" width="330" height="64" rx="8"/><rect x="10" y="19.0" width="26