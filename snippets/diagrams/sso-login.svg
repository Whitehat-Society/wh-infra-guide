<svg class="whd" viewBox="0 0 980 280" style="--w:980px" role="img" aria-label="How the terminal signs in to AWS"><title>How the terminal signs in to AWS</title><defs><marker id="d-sso-login-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker><marker id="d-sso-login-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--accent)"/></marker></defs><path class="edge" d="M140,110 L140,52 L340,52" marker-end="url(#d-sso-login-m)"/><path class="edge" d="M580,52 L700,52" marker-end="url(#d-sso-login-m)"/><path class="edge" d="M830,84 L830,142 L260,142" marker-end="url(#d-sso-login-m)"/><path class="edge" d="M200,174 L200,232 L700,232" marker-end="url(#d-sso-login-m)"/><g class="elbl"><rect x="205.4" y="42" width="69.2" height="20" rx="4"/><circle class="num" cx="217.4" cy="52" r="8"/><text class="numt" x="217.4" y="56" text-anchor="middle">1</text><text x="250" y="56" text-anchor="middle">opens</text></g><g class="elbl"><rect x="597.96" y="42.0" width="84.08" height="20" rx="4"/><circle class="num" cx="609.96" cy="52.0" r="8"/><text class="numt" x="609.96" y="56.0" text-anchor="middle">2</text><text x="650.0" y="56.0" text-anchor="middle">sign in</text></g><g class="elbl"><rect x="488.08" y="132" width="113.84" height="20" rx="4"/><circle class="num" cx="500.08" cy="142" r="8"/><text class="numt" x="500.08" y="146" text-anchor="middle">3</text><text x="555" y="146" text-anchor="middle">8-hour keys</text></g><g class="elbl"><rect x="370.76" y="222" width="158.48000000000002" height="20" rx="4"/><circle class="num" cx="382.76" cy="232" r="8"/><text class="numt" x="382.76" y="236" text-anchor="middle">4</text><text x="460" y="236" text-anchor="middle">every aws command</text></g><g class="node" transform="translate(20 110)"><rect class="body" width="240" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#1d7a46"/><text class="gly" x="23" y="35.5" text-anchor="middle">CLI</text><text class="ttl" x="44" y="29.0">Your terminal</text><text class="sub" x="44" y="46.0">aws sso login</text></g><g class="node" transform="translate(340 20)"><rect class="body" width="240" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#64748b"/><text class="gly" x="23" y="35.5" text-anchor="middle">WWW</text><text class="ttl" x="44" y="29.0">Browser</text><text class="sub" x="44" y="46.0">you sign in, click Allow</text></g><g class="node" transform="translate(700 20)"><rect class="body" width="260" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#DD344C"/><text class="gly" x="23" y="35.5" text-anchor="middle">IAM</text><text class="ttl" x="44" y="29.0">IAM Identity Center</text><text class="sub" x="44" y="46.0">checks your login</text></g><g class="node" transform="translate(700 200)"><rect class="body" width="260" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#64748b"/><text class="gly" x="23" y="35.5" text-anchor="middle">AWS</text><text class="ttl" x="44" y="29.0">AWS account</text><text class="sub" x="44" y="46.0">accepts the keys</text></g></svg>
