"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#0b7a94"/><text class="gly" x="23" y="35.5" text-anchor="middle">WEB</text><text class="ttl" x="44" y="29.0">Web challenges</text><text class="sub" x="44" y="46.0">one copy each</text></g><g class="node" transform="translate(850 300)"><rect class="body" width="190" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#0b7a94"/><text class="gly" x="23" y="35.5" text-anchor="middle">TCP</text><text class="ttl" x="44" y="29.0">Pwn challenges</text><text class="sub" x="44" y="46.0">one copy each</text></g></svg>
