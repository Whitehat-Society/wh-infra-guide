<svg class="whd" viewBox="0 0 1220 500" style="--w:1220px" role="img" aria-label="Where copies of data are kept"><title>Where copies of data are kept</title><defs><marker id="d-data-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker><marker id="d-data-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--accent)"/></marker></defs><rect class="grp" x="10" y="10" width="330" height="480" rx="8" stroke="#64748b" stroke-dasharray="5 4"/><text class="glbl" x="20" y="29" fill="#64748b">Your computer</text><rect class="grp" x="370" y="10" width="400" height="480" rx="8" stroke="var(--ink)"/><text class="glbl" x="380" y="29" fill="var(--ink)">AWS account</text><rect class="grp" x="800" y="10" width="410" height="480" rx="8" stroke="#326CE5"/><text class="glbl" x="810" y="29" fill="#326CE5">Cluster</text><g class="node" transform="translate(30 50)"><rect class="body" width="290" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#1d7a46"/><text class="gly" x="23" y="35.5" text-anchor="middle">DIR</text><text class="ttl" x="44" y="29.0">wh-2026 folder</text><text class="sub" x="44" y="46.0">challenge.yml, settings files</text></g><g class="node" transform="translate(30 140)"><rect class="body" width="290" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">IMG</text><text class="ttl" x="44" y="29.0">Docker build cache</text><text class="sub" x="44" y="46.0">image layers</text></g><g class="node" transform="translate(30 230)"><rect class="body" width="290" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#DD344C"/><text class="gly" x="23" y="35.5" text-anchor="middle">KEY</text><text class="ttl" x="44" y="29.0">Sign-ins</text><text class="sub" x="44" y="46.0">AWS, Docker to ECR, kubeconfig</text></g><g class="node" transform="translate(30 320)"><rect class="body" width="290" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">TF</text><text class="ttl" x="44" y="29.0">Terraform state</text><text class="sub" x="44" y="46.0">only on this computer</text></g><g class="node" transform="translate(30 395)"><rect class="body" width="290" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#8C4FFF"/><text class="gly" x="23" y="35.5" text-anchor="middle">DNS</text><text class="ttl" x="44" y="29.0">DNS answers</text><text class="sub" x="44" y="46.0">computer, browser, router</text></g><g class="node" transform="translate(390 50)"><rect class="body" width="360" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#ED7100"/><text class="gly" x="23" y="35.5" text-anchor="middle">ECR</text><text class="ttl" x="44" y="29.0">ECR images</text><text class="sub" x="44" y="46.0">one tag per challenge, overwritten</text></g><g class="node" transform="translate(390 140)"><rect class="body" width="360" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#7AA116"/><text class="gly" x="23" y="35.5" text-anchor="middle">PUL</text><text class="ttl" x="44" y="29.0">Pulumi state (S3)</text><text class="sub" x="44" y="46.0">what Pulumi built, its settings</text></g><g class="node" transform="translate(390 230)"><rect class="body" width="360" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#DD344C"/><text class="gly" x="23" y="35.5" text-anchor="middle">SEC</text><text class="ttl" x="44" y="29.0">Secrets Manager</text><text class="sub" x="44" y="46.0">kept 7 days after deletion</text></g><g class="node" transform="translate(390 320)"><rect class="body" width="360" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#7AA116"/><text class="gly" x="23" y="35.5" text-anchor="middle">S3</text><text class="ttl" x="44" y="29.0">Backups (S3)</text><text class="sub" x="44" y="46.0">database only, kept 30 days</text></g><g class="node" transform="translate(390 395)"><rect class="body" width="360" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#8C4FFF"/><text class="gly" x="23" y="35.5" text-anchor="middle">DNS</text><text class="ttl" x="44" y="29.0">Route 53 and CloudWatch logs</text><text class="sub" x="44" y="46.0">records, logs that never expire</text></g><g class="node" transform="translate(820 50)"><rect class="body" width="370" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#ED7100"/><text class="gly" x="23" y="35.5" text-anchor="middle">EC2</text><text class="ttl" x="44" y="29.0">Node image cache</text><text class="sub" x="44" y="46.0">images each computer downloaded</text></g><g class="node" transform="translate(820 140)"><rect class="body" width="370" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#C925D1"/><text class="gly" x="23" y="35.5" text-anchor="middle">DB</text><text class="ttl" x="44" y="29.0">MariaDB disk</text><text class="sub" x="44" y="46.0">teams, solves, challenges</text></g><g class="node" transform="translate(820 230)"><rect class="body" width="370" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#C925D1"/><text class="gly" x="23" y="35.5" text-anchor="middle">RDS</text><text class="ttl" x="44" y="29.0">Redis disk</text><text class="sub" x="44" y="46.0">CTFd&#x27;s cache and logins</text></g><g class="node" transform="translate(820 320)"><rect class="body" width="370" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#7AA116"/><text class="gly" x="23" y="35.5" text-anchor="middle">EBS</text><text class="ttl" x="44" y="29.0">Uploads disk</text><text class="sub" x="44" y="46.0">files players download</text></g><g class="node" transform="translate(820 395)"><rect class="body" width="370" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#DD344C"/><text class="gly" x="23" y="35.5" text-anchor="middle">SEC</text><text class="ttl" x="44" y="29.0">Certificates</text><text class="sub" x="44" y="46.0">5 identical per week at most</text></g></svg>
