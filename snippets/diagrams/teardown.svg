<svg class="whd" viewBox="0 0 1160 300" style="--w:1160px" role="img" aria-label="The order in which teardown deletes things"><title>The order in which teardown deletes things</title><defs><marker id="d-teardown-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker><marker id="d-teardown-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--accent)"/></marker></defs><rect class="grp" x="10" y="10" width="350" height="280" rx="8" stroke="#64748b"/><text class="glbl" x="20" y="29" fill="#64748b">make destroy runs</text><rect class="grp" x="430" y="10" width="720" height="280" rx="8" stroke="#64748b"/><text class="glbl" x="440" y="29" fill="#64748b">What it deletes</text><path class="edge" d="M345,77 L445,77" marker-end="url(#d-teardown-m)"/><path class="edge" d="M345,162 L445,162" marker-end="url(#d-teardown-m)"/><path class="edge" d="M345,247 L445,247" marker-end="url(#d-teardown-m)"/><g class="node" transform="translate(25 45)"><rect class="body" width="320" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#1d7a46"/><text class="gly" x="23" y="35.5" text-anchor="middle">1</text><text class="ttl" x="44" y="29.0">pulumi destroy</text><text class="sub" x="44" y="46.0">shared-tcp, web-shared, ctfd</text></g><g class="node" transform="translate(25 130)"><rect class="body" width="320" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#1d7a46"/><text class="gly" x="23" y="35.5" text-anchor="middle">2</text><text class="ttl" x="44" y="29.0">terraform destroy</text><text class="sub" x="44" y="46.0">utils/eks</text></g><g class="node" transform="translate(25 215)"><rect class="body" width="320" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#1d7a46"/><text class="gly" x="23" y="35.5" text-anchor="middle">3</text><text class="ttl" x="44" y="29.0">aws logs delete-log-group</text><text class="sub" x="44" y="46.0">one per monitoring log</text></g><g class="node" transform="translate(445 45)"><rect class="body" width="690" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#326CE5"/><text class="gly" x="23" y="35.5" text-anchor="middle">K8S</text><text class="ttl" x="44" y="29.0">Challenges, CTFd, and through the helpers:</text><text class="sub" x="44" y="46.0">their load balancers, DNS records and disks</text></g><g class="node" transform="translate(445 130)"><rect class="body" width="690" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#8C4FFF"/><text class="gly" x="23" y="35.5" text-anchor="middle">AWS</text><text class="ttl" x="44" y="29.0">Cluster, network, alarms, buckets, registries</text><text class="sub" x="44" y="46.0">also the secret, after a 7-day grace period</text></g><g class="node" transform="translate(445 215)"><rect class="body" width="690" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#E7157B"/><text class="gly" x="23" y="35.5" text-anchor="middle">LOG</text><text class="ttl" x="44" y="29.0">Log groups the monitoring add-ons made</text><text class="sub" x="44" y="46.0">Terraform doesn&#x27;t know them, and they never expire</text></g></svg>
