<svg class="whd" viewBox="0 0 1020 260" style="--w:1020px" role="img" aria-label="How a name becomes an address"><title>How a name becomes an address</title><defs><marker id="d-dns-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker><marker id="d-dns-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--accent)"/></marker></defs><path class="edge dash" d="M240,72 L360,72" marker-end="url(#d-dns-m)"/><path class="edge dash" d="M780,72 L620,72" marker-end="url(#d-dns-m)"/><path class="edge" d="M240,190 L490,190 L490,104" marker-end="url(#d-dns-m)"/><path class="edge" d="M240,222 L780,222" marker-end="url(#d-dns-m)"/><g class="elbl"><rect x="260.52" y="62.0" width="78.96" height="20" rx="4"/><text x="300.0" y="76.0" text-anchor="middle">points to</text></g><g class="elbl"><rect x="641.92" y="62.0" width="116.16" height="20" rx="4"/><text x="700.0" y="76.0" text-anchor="middle">writes records</text></g><g class="elbl"><rect x="274.6" y="180" width="180.8" height="20" rx="4"/><circle class="num" cx="286.6" cy="190" r="8"/><text class="numt" x="286.6" y="194" text-anchor="middle">1</text><text x="375" y="194" text-anchor="middle">asks for the address</text></g><g class="elbl"><rect x="604.24" y="212" width="91.52" height="20" rx="4"/><circle class="num" cx="616.24" cy="222" r="8"/><text class="numt" x="616.24" y="226" text-anchor="middle">2</text><text x="660" y="226" text-anchor="middle">connects</text></g><g class="node" transform="translate(20 40)"><rect class="body" width="220" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#64748b"/><text class="gly" x="23" y="35.5" text-anchor="middle">REG</text><text class="ttl" x="44" y="29.0">Registrar</text><text class="sub" x="44" y="46.0">where you rent the name</text></g><g class="node" transform="translate(360 40)"><rect class="body" width="260" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#8C4FFF"/><text class="gly" x="23" y="35.5" text-anchor="middle">DNS</text><text class="ttl" x="44" y="29.0">Route 53 hosted zone</text><text class="sub" x="44" y="46.0">the domain&#x27;s records</text></g><g class="node" transform="translate(780 40)"><rect class="body" width="220" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#326CE5"/><text class="gly" x="23" y="35.5" text-anchor="middle">K8S</text><text class="ttl" x="44" y="29.0">ExternalDNS</text><text class="sub" x="44" y="46.0">runs in the cluster</text></g><g class="node" transform="translate(20 170)"><rect class="body" width="220" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#64748b"/><text class="gly" x="23" y="35.5" text-anchor="middle">USR</text><text class="ttl" x="44" y="29.0">Player&#x27;s browser</text><text class="sub" x="44" y="46.0">ctf.example-ctf.com</text></g><g class="node" transform="translate(780 170)"><rect class="body" width="220" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#8C4FFF"/><text class="gly" x="23" y="35.5" text-anchor="middle">LB</text><text class="ttl" x="44" y="29.0">Load balancer</text><text class="sub" x="44" y="46.0">the address</text></g></svg>
