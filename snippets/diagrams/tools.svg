<svg class="whd" viewBox="0 0 1120 510" style="--w:1120px" role="img" aria-label="The tools on your computer and what each one talks to"><title>The tools on your computer and what each one talks to</title><defs><marker id="d-tools-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker><marker id="d-tools-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--accent)"/></marker></defs><rect class="grp" x="10" y="10" width="420" height="490" rx="8" stroke="#64748b" stroke-dasharray="5 4"/><text class="glbl" x="20" y="29" fill="#64748b">Your computer</text><path class="edge" d="M410,77 L620,77" marker-end="url(#d-tools-m)"/><path class="edge" d="M410,153 L620,153" marker-end="url(#d-tools-m)"/><path class="edge" d="M410,229 L620,229" marker-end="url(#d-tools-m)"/><path class="edge" d="M410,305 L620,305" marker-end="url(#d-tools-m)"/><path class="edge" d="M410,381 L620,381" marker-end="url(#d-tools-m)"/><g class="node" transform="translate(30 45)"><rect class="body" width="380" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">GIT</text><text class="ttl" x="44" y="29.0">git, gh</text><text class="sub" x="44" y="46.0">download the code</text></g><g class="node" transform="translate(30 121)"><rect class="body" width="380" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">AWS</text><text class="ttl" x="44" y="29.0">aws, terraform, pulumi, go</text><text class="sub" x="44" y="46.0">create and change AWS resources</text></g><g class="node" transform="translate(30 197)"><rect class="body" width="380" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">K8S</text><text class="ttl" x="44" y="29.0">kubectl</text><text class="sub" x="44" y="46.0">look inside the cluster</text></g><g class="node" transform="translate(30 273)"><rect class="body" width="380" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">DKR</text><text class="ttl" x="44" y="29.0">docker</text><text class="sub" x="44" y="46.0">build and upload images</text></g><g class="node" transform="translate(30 349)"><rect class="body" width="380" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">PY</text><text class="ttl" x="44" y="29.0">python3, ctfcli</text><text class="sub" x="44" y="46.0">run builder.py, load challenges</text></g><g class="node" transform="translate(30 425)"><rect class="body" width="380" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">SH</text><text class="ttl" x="44" y="29.0">make, jq, nc, curl, dig</text><text class="sub" x="44" y="46.0">small helpers used by the commands</text></g><g class="node" transform="translate(620 45)"><rect class="body" width="480" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#64748b"/><text class="gly" x="23" y="35.5" text-anchor="middle">GIT</text><text class="ttl" x="44" y="29.0">GitHub</text><text class="sub" x="44" y="46.0">wh-base and the event repository</text></g><g class="node" transform="translate(620 121)"><rect class="body" width="480" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#8C4FFF"/><text class="gly" x="23" y="35.5" text-anchor="middle">AWS</text><text class="ttl" x="44" y="29.0">The AWS account</text><text class="sub" x="44" y="46.0">network, cluster, buckets, secret</text></g><g class="node" transform="translate(620 197)"><rect class="body" width="480" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#326CE5"/><text class="gly" x="23" y="35.5" text-anchor="middle">K8S</text><text class="ttl" x="44" y="29.0">The Kubernetes cluster</text><text class="sub" x="44" y="46.0">pods, Services, logs</text></g><g class="node" transform="translate(620 273)"><rect class="body" width="480" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#ED7100"/><text class="gly" x="23" y="35.5" text-anchor="middle">ECR</text><text class="ttl" x="44" y="29.0">ECR registry</text><text class="sub" x="44" y="46.0">challenge and CTFd images</text></g><g class="node" transform="translate(620 349)"><rect class="body" width="480" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#0b7a94"/><text class="gly" x="23" y="35.5" text-anchor="middle">APP</text><text class="ttl" x="44" y="29.0">CTFd</text><text class="sub" x="44" y="46.0">the challenge list</text></g></svg>
