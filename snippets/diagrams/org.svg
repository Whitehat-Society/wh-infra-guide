<svg class="whd" viewBox="0 0 1180 300" style="--w:1180px" role="img" aria-label="The three accounts AWS creates when you activate advanced features"><title>The three accounts AWS creates when you activate advanced features</title><defs><marker id="d-org-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker><marker id="d-org-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--accent)"/></marker></defs><rect class="grp" x="10" y="10" width="1160" height="280" rx="8" stroke="var(--ink)"/><text class="glbl" x="20" y="29" fill="var(--ink)">Your AWS organization</text><path class="edge" d="M370,92 L700,92 L700,145 L800,145" marker-end="url(#d-org-m)"/><path class="edge" d="M370,222 L700,222 L700,170 L800,170" marker-end="url(#d-org-m)"/><g class="elbl"><rect x="432.28" y="82" width="205.44" height="20" rx="4"/><text x="535" y="96" text-anchor="middle">rules limit what it may do</text></g><g class="elbl"><rect x="462.04" y="212" width="145.92" height="20" rx="4"/><text x="535" y="226" text-anchor="middle">lets your login in</text></g><g class="node" transform="translate(40 60)"><rect class="body" width="330" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#E7157B"/><text class="gly" x="23" y="35.5" text-anchor="middle">ORG</text><text class="ttl" x="44" y="29.0">Management account</text><text class="sub" x="44" y="46.0">card, bills, the rules (SCPs)</text></g><g class="node" transform="translate(40 190)"><rect class="body" width="330" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#DD344C"/><text class="gly" x="23" y="35.5" text-anchor="middle">IAM</text><text class="ttl" x="44" y="29.0">Identity account</text><text class="sub" x="44" y="46.0">logins: IAM Identity Center</text></g><g class="node" transform="translate(800 125)"><rect class="body" width="340" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#8C4FFF"/><text class="gly" x="23" y="35.5" text-anchor="middle">AWS</text><text class="ttl" x="44" y="29.0">Project account</text><text class="sub" x="44" y="46.0">the CTF runs here</text></g></svg>
