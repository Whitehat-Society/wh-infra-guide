<svg class="whd" viewBox="0 0 1220 460" style="--w:1220px" role="img" aria-label="Which command runs which tool, and what it builds"><title>Which command runs which tool, and what it builds</title><defs><marker id="d-who-builds-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker><marker id="d-who-builds-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--accent)"/></marker></defs><rect class="grp" x="10" y="10" width="290" height="440" rx="8" stroke="#64748b"/><text class="glbl" x="20" y="29" fill="#64748b">You type</text><rect class="grp" x="370" y="10" width="330" height="440" rx="8" stroke="#64748b"/><text class="glbl" x="380" y="29" fill="#64748b">Tool</text><rect class="grp" x="770" y="10" width="440" height="440" rx="8" stroke="#64748b"/><text class="glbl" x="780" y="29" fill="#64748b">What it builds</text><path class="edge" d="M285,70 L385,70" marker-end="url(#d-who-builds-m)"/><path class="edge" d="M285,150 L385,150" marker-end="url(#d-who-builds-m)"/><path class="edge" d="M285,230 L385,230" marker-end="url(#d-who-builds-m)"/><path class="edge" d="M285,310 L385,310" marker-end="url(#d-who-builds-m)"/><path class="edge" d="M285,390 L385,390" marker-end="url(#d-who-builds-m)"/><path class="edge" d="M685,77 L785,77" marker-end="url(#d-who-builds-m)"/><path class="edge" d="M685,157 L785,157" marker-end="url(#d-who-builds-m)"/><path class="edge" d="M685,237 L785,237" marker-end="url(#d-who-builds-m)"/><path class="edge" d="M685,317 L785,317" marker-end="url(#d-who-builds-m)"/><path class="edge" d="M685,397 L785,397" marker-end="url(#d-who-builds-m)"/><g class="node" transform="translate(25 45)"><rect class="body" width="260" height="50" rx="8"/><rect x="10" y="12.0" width="26" height="26" rx="6" fill="#1d7a46"/><text class="gly" x="23" y="28.5" text-anchor="middle">1</text><text class="ttl" x="44" y="30.0">make secrets</text></g><g class="node" transform="translate(25 125)"><rect class="body" width="260" height="50" rx="8"/><rect x="10" y="12.0" width="26" height="26" rx="6" fill="#1d7a46"/><text class="gly" x="23" y="28.5" text-anchor="middle">2</text><text class="ttl" x="44" y="30.0">make deploy-eks</text></g><g class="node" transform="translate(25 205)"><rect class="body" width="260" height="50" rx="8"/><rect x="10" y="12.0" width="26" height="26" rx="6" fill="#1d7a46"/><text class="gly" x="23" y="28.5" text-anchor="middle">3</text><text class="ttl" x="44" y="30.0">make deploy-ctfd</text></g><g class="node" transform="translate(25 285)"><rect class="body" width="260" height="50" rx="8"/><rect x="10" y="12.0" width="26" height="26" rx="6" fill="#1d7a46"/><text class="gly" x="23" y="28.5" text-anchor="middle">4</text><text class="ttl" x="44" y="30.0">make build-images</text></g><g class="node" transform="translate(25 365)"><rect class="body" width="260" height="50" rx="8"/><rect x="10" y="12.0" width="26" height="26" rx="6" fill="#1d7a46"/><text class="gly" x="23" y="28.5" text-anchor="middle">5</text><text class="ttl" x="44" y="30.0">make deploy-…-cronjob</text></g><g class="node" transform="translate(385 45)"><rect class="body" width="300" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">PY</text><text class="ttl" x="44" y="29.0">secrets.py</text><text class="sub" x="44" y="46.0">AWS Secrets Manager</text></g><g class="node" transform="translate(385 125)"><rect class="body" width="300" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">TF</text><text class="ttl" x="44" y="29.0">Terraform</text><text class="sub" x="44" y="46.0">utils/eks</text></g><g class="node" transform="translate(385 205)"><rect class="body" width="300" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">PUL</text><text class="ttl" x="44" y="29.0">Docker, then Pulumi</text><text class="sub" x="44" y="46.0">utils/ctfd</text></g><g class="node" transform="translate(385 285)"><rect class="body" width="300" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">PY</text><text class="ttl" x="44" y="29.0">builder.py</text><text class="sub" x="44" y="46.0">Docker, Pulumi, ctfcli</text></g><g class="node" transform="translate(385 365)"><rect class="body" width="300" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#5268a6"/><text class="gly" x="23" y="35.5" text-anchor="middle">K8S</text><text class="ttl" x="44" y="29.0">kubectl</text><text class="sub" x="44" y="46.0">utils/ctfd/*.yaml</text></g><g class="node" transform="translate(785 45)"><rect class="body" width="410" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#DD344C"/><text class="gly" x="23" y="35.5" text-anchor="middle">KEY</text><text class="ttl" x="44" y="29.0">The secret &lt;event&gt;/config</text><text class="sub" x="44" y="46.0">generated passwords, your webhooks</text></g><g class="node" transform="translate(785 125)"><rect class="body" width="410" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#8C4FFF"/><text class="gly" x="23" y="35.5" text-anchor="middle">AWS</text><text class="ttl" x="44" y="29.0">Network, cluster, helpers</text><text class="sub" x="44" y="46.0">plus alarms, buckets, registries</text></g><g class="node" transform="translate(785 205)"><rect class="body" width="410" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#0b7a94"/><text class="gly" x="23" y="35.5" text-anchor="middle">APP</text><text class="ttl" x="44" y="29.0">CTFd, its database and cache</text><text class="sub" x="44" y="46.0">and the address ctf.&lt;domain&gt;</text></g><g class="node" transform="translate(785 285)"><rect class="body" width="410" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#0b7a94"/><text class="gly" x="23" y="35.5" text-anchor="middle">WEB</text><text class="ttl" x="44" y="29.0">Every challenge</text><text class="sub" x="44" y="46.0">running, and loaded into CTFd</text></g><g class="node" transform="translate(785 365)"><rect class="body" width="410" height="64" rx="8"/><rect x="10" y="19.0" width="26" height="26" rx="6" fill="#326CE5"/><text class="gly" x="23" y="35.5" text-anchor="middle">CRN</text><text class="ttl" x="44" y="29.0">Backup and health checks</text><text class="sub" x="44" y="46.0">on a schedule</text></g></svg>
