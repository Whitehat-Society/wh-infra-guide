name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans every commit in the push
      - run: scripts/scan.sh
      - name: Scan changed commits with Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl -fsSL "$url" -o "/tmp/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            log_opts="${PR_BASE_SHA}..${HEAD_SHA}"
          elif [[ "$EVENT_NAME" == "push" && "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            log_opts="${EVENT_BEFORE}..${HEAD_SHA}"
          else
            log_opts="--all"
          fi
          /tmp/gitleaks git --redact --verbose --log-opts="$log_opts" .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Diagrams pass the geometry lint and match their sources
        run: python scripts/diagrams.py && git diff --exit-code snippets/diagrams
      # wh-base is private, so this runs once a token that can read it is saved as WH_BASE_TOKEN.
      - name: The guide still matches wh-base
        env: {WH_BASE_TOKEN: '${{ secrets.WH_BASE_TOKEN }}'}
        if: env.WH_BASE_TOKEN != ''
        run: |
          git clone -q "https://x-access-token:$WH_BASE_TOKEN@github.com/Whitehat-Society/wh-base" ../wh-base
          python scripts/check_code.py ../wh-base
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
