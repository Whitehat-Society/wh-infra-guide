site_name: WH Infra Guide
site_description: Build and run the Whitehacks CTF infrastructure from a blank PC.
site_url: https://lampardnk.github.io/wh-infra-guide/
repo_url: https://github.com/Whitehat-Society/wh-base
repo_name: Whitehat-Society/wh-base
edit_uri: https://github.com/lampardnk/wh-infra-guide/edit/main/docs/

theme:
  name: material
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - toc.integrate
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight

extra_css:
  - https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap
  - stylesheets/wh.css
extra_javascript:
  - javascripts/explorer.js
  - javascripts/sequences.js
  - javascripts/glossary.js
  - javascripts/sidebar.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.keys
  - pymdownx.snippets: { base_path: [snippets, docs/assets/scripts], check_paths: true }

nav:
  - Start here: index.md
  - 1 · How the system works:
      - What we're building: concepts/big-picture.md
      - 1. The account and the domain: concepts/account.md
      - 2. The network and the computers: concepts/network.md
      - 3. Kubernetes and its helpers: concepts/kubernetes.md
      - 4. The scoreboard: concepts/scoreboard.md
      - 5. The challenges: concepts/challenges.md
      - 6. Alarms and backups: concepts/safety.md
      - Putting it together: concepts/together.md
  - 2 · Your computer:
      - Overview: setup/index.md
      - Open a terminal: setup/terminal.md
      - Terminal basics: setup/terminal-basics.md
      - Install the tools: setup/pc.md
  - 3 · Accounts:
      - Overview: accounts/index.md
      - AWS account: accounts/aws.md
      - Prepare the account: accounts/prepare.md
      - Sign in from the terminal: accounts/cli-login.md
      - Budget alert: accounts/budget.md
      - Domain name: accounts/domain.md
      - Discord and GitHub: accounts/discord-github.md
  - 4 · Code and settings:
      - Overview: code/index.md
      - Get the code: code/clone.md
      - Your settings: code/make-it-yours.md
      - Secrets: code/config.md
  - 5 · Deploy:
      - Overview: deploy/index.md
      - 1. The cluster: deploy/eks.md
      - 2. The scoreboard: deploy/ctfd.md
      - 3. The challenges: deploy/challenges.md
      - 4. Backups and health checks: deploy/day2.md
      - 5. Final checks: deploy/verify.md
  - 6 · Run the event:
      - Overview: operate/index.md
      - Watching the system: operate/monitoring.md
      - Adding capacity: operate/scaling.md
      - Change a challenge: operate/change.md
      - Where data is kept: operate/data.md
      - Backup and restore: operate/backups.md
      - Collect the results: operate/results.md
      - Known weak spots: operate/risks.md
  - 7 · Tear down:
      - Delete everything: teardown.md
  - Write a challenge:
      - Your challenge folder: write/index.md
      - challenge.yml: write/challenge-yml.md
      - Challenges with a server: write/server.md
      - Hand it in: write/submit.md
  - Reference:
      - Architecture explorer: reference/architecture.md
      - Glossary: reference/glossary.md
      - Troubleshooting: reference/troubleshooting.md
      - Code map: reference/code.md
      - "Appendix: chall-manager": reference/chall-manager.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
