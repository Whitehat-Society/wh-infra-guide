{% extends "base.html" %}
{% block extrahead %}
<script>
  // Ctrl + scroll and Ctrl + plus, minus or 0 scale the text (--wh-zoom in wh.css) instead of zooming the
  // page, so the layout keeps the full width. Runs in <head> so a saved size applies before the first paint.
  (function () {
    var KEY = "wh-zoom", root = document.documentElement, zoom = 1;
    try { zoom = parseFloat(localStorage.getItem(KEY)) || 1; } catch (e) {}
    function set(z) {
      zoom = Math.min(3, Math.max(0.5, z));
      root.style.setProperty("--wh-zoom", zoom);
      try { localStorage.setItem(KEY, zoom); } catch (e) {}
    }
    set(zoom);
    addEventListener("wheel", function (e) {
      if (!e.ctrlKey) return;
      e.preventDefault();
      set(zoom * Math.exp(-e.deltaY * 0.001));
    }, { passive: false });
    addEventListener("keydown", function (e) {
      if (!(e.ctrlKey || e.metaKey)) return;
      var step = { "=": 1.1, "+": 1.1, "-": 1 / 1.1, "0": 0 }[e.key];
      if (step === undefined) return;
      e.preventDefault();
      set(step ? zoom * step : 1);
    });
  })();
</script>
{% endblock %}
